services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openpurpose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpurpose}
      POSTGRES_DB: openpurpose
    volumes:
      - openpurpose-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpurpose"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  openpurpose:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openpurpose:${POSTGRES_PASSWORD:-openpurpose}@db:5432/openpurpose
      OPENPURPOSE_GROUP_NAME: ${OPENPURPOSE_GROUP_NAME:-}
      OPENPURPOSE_ORG_NAME: ${OPENPURPOSE_ORG_NAME:-Our company}
      OPENPURPOSE_PUBLIC_URL: ${OPENPURPOSE_PUBLIC_URL:-http://localhost:8080}
      # Optional: fix the first admin's token instead of reading it from the log.
      OPENPURPOSE_BOOTSTRAP_TOKEN: ${OPENPURPOSE_BOOTSTRAP_TOKEN:-}
      # Behind a reverse proxy: true, or the proxy's addresses. See the README.
      OPENPURPOSE_TRUST_PROXY: ${OPENPURPOSE_TRUST_PROXY:-}
      # Optional: sign-in by email link and GitHub, and sign-up. See the README.
      OPENPURPOSE_AUTH_PROVIDER: ${OPENPURPOSE_AUTH_PROVIDER:-}
      OPENPURPOSE_SUPABASE_URL: ${OPENPURPOSE_SUPABASE_URL:-}
      OPENPURPOSE_SUPABASE_KEY: ${OPENPURPOSE_SUPABASE_KEY:-}
      OPENPURPOSE_SIGNUP: ${OPENPURPOSE_SIGNUP:-off}
      OPENPURPOSE_SITE_URL: ${OPENPURPOSE_SITE_URL:-}
      OPENPURPOSE_SESSION_DAYS: ${OPENPURPOSE_SESSION_DAYS:-30}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  openpurpose-db:
